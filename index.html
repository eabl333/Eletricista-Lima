<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site em manutenção | Eletricista Lima</title>
  <meta name="description" content="O site do Eletricista Lima está em manutenção. Atendimento elétrico em Cotia - SP pelo WhatsApp (11) 95218-4814.">
  <meta name="theme-color" content="#0b2a4a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-900: #071a2f;
      --navy-800: #0b2a4a;
      --navy-600: #1b4a7a;
      --green: #25d366;
      --yellow: #ffc83d;
      --white: #ffffff;
      --text: #dbe7f5;
      --muted: #9fb3cc;
      --border: rgba(255,255,255,.14);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.7;
      background:
        radial-gradient(circle at 85% 15%, rgba(37,211,102,.10), transparent 40%),
        linear-gradient(160deg, var(--navy-800), var(--navy-900));
      background-attachment: fixed;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    .page {
      min-height: 100vh;
      width: min(1100px, 92%);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      padding: 28px 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; color: var(--white); font-weight: 500; font-size: 1.2rem; }
    .brand strong { color: var(--green); font-weight: 600; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; background: var(--green); color: var(--navy-900); border-radius: 10px; }
    .brand-mark svg { width: 20px; height: 20px; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 56px;
      align-items: center;
      padding: 48px 0;
    }

    h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.08; font-weight: 800; color: var(--white); margin-bottom: 20px; letter-spacing: -.02em; }
    .lead { font-size: 1.1rem; color: var(--muted); max-width: 30em; margin-bottom: 32px; }

    .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 36px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 28px; border-radius: 50px; font-weight: 600; font-size: 1rem; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn:hover { transform: translateY(-2px); }
    .btn-whats { background: var(--green); color: var(--navy-900); box-shadow: 0 10px 25px rgba(37,211,102,.3); }
    .btn-whats:hover { box-shadow: 0 14px 32px rgba(37,211,102,.45); }
    .btn-line { border: 2px solid var(--border); color: var(--white); }
    .btn-line:hover { border-color: var(--green); }

    .info { display: grid; gap: 6px; padding-top: 24px; border-top: 1px solid var(--border); font-size: .95rem; color: var(--muted); max-width: 30em; }
    .info b { color: var(--white); font-weight: 500; }

    /* Disjuntor: o elemento principal da página */
    .breaker-wrap { display: grid; place-items: center; }
    .breaker { width: min(300px, 80%); height: auto; overflow: visible; }
    .lever { transform-origin: 150px 150px; transform: translateY(0); }
    .led { fill: #3a2a1c; }
    .spark { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .led { animation: led-warn 2.4s ease-in-out 1s infinite; }
      .lever { animation: nudge .9s cubic-bezier(.3,1.6,.5,1) .4s both; }
      .spark { animation: spark .6s ease-out .55s both; }
    }
    @keyframes nudge { from { transform: translateY(-14px); } to { transform: translateY(0); } }
    @keyframes led-warn { 0%, 100% { fill: #3a2a1c; } 50% { fill: var(--yellow); } }
    @keyframes spark { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

    footer { color: var(--muted); font-size: .85rem; padding-top: 20px; border-top: 1px solid var(--border); }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; gap: 24px; padding: 32px 0; }
      .breaker-wrap { order: -1; }
      .breaker { width: 160px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a href="#" class="brand" aria-label="Eletricista Lima">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.2L9 22l10-12.2h-6.4L13.5 2Z"/></svg>
      </span>
      <span>Eletricista <strong>Lima</strong></span>
    </a>

    <main>
      <section>
        <h1>Site Fora do Ar!</h1>
        <p class="lead">O site volta em breve.</p>
    

      <div class="breaker-wrap" aria-hidden="true">
        <svg class="breaker" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
          <!-- corpo -->
          <rect x="60" y="20" width="180" height="340" rx="22" fill="#123a63" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
          <rect x="82" y="44" width="136" height="292" rx="14" fill="#0b2a4a" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
          <!-- fenda da alavanca -->
          <rect x="116" y="70" width="68" height="190" rx="12" fill="#04101e"/>
          <!-- alavanca (posição desligado: embaixo) -->
          <g class="lever">
            <rect x="124" y="170" width="52" height="84" rx="10" fill="#dbe7f5"/>
            <rect x="132" y="180" width="36" height="6" rx="3" fill="#9fb3cc"/>
            <rect x="132" y="194" width="36" height="6" rx="3" fill="#9fb3cc"/>
          </g>
          <!-- faíscas ao desarmar -->
          <g class="spark" stroke="#ffc83d" stroke-width="4" stroke-linecap="round">
            <path d="M104 168l-18-10"/><path d="M196 168l18-10"/><path d="M100 188l-20 0"/><path d="M200 188l20 0"/>
          </g>
          <!-- indicador -->
          <circle class="led" cx="150" cy="292" r="9" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
          <text x="150" y="322" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="14" fill="#9fb3cc">OFF</text>
        </svg>
      </div>
    </main>

    <footer>© <span id="year"></span> Eletricista Lima. Todos os direitos reservados.</footer>
  </div>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
